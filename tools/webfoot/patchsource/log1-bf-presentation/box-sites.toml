[[payload]]
label = "bf-box-window"
file = "bf-box-window.bin"
source_class = "new"
origin_note = "two LOG1-side jobs per dialogue frame, both from measured bytes. (1) It advances the donor's uniform opening ramp one step: E measured PA = PD = trunc(2048/(2+k)) for k = 0..6 on frames 191..197 (1024/682/512/409/341/292/256) with PB = PC = 0 and matrix 0 on all four box entries. Matrix m lives in the pad halfwords of shadow entries 4m..4m+3 (PA at 0x0202BE24+0x20*m+0x06, PB +0x0E, PC +0x16, PD +0x1E) and a sprite selects m with attr1 bits 9..13, not with its own entry index. The walk starts from the 2048 bf-box-strips wrote, so the first flushed frame is k = 0 and the seventh is the resting 1:1; it only advances from a value these two payloads wrote, so a native matrix user is never touched, and PB/PC stay zero because the page rebuild zero-fills the whole 1024-byte shadow (0x080098DE). (2) It clears the retail 9-slice window entries out of the page object's own 2,048-byte map at 0x02029D94+0x24 before the retail publish, so a BG entry cannot cover the object box. The map is inline, the entry form (bank<<12|tile) and the publish are LOG1 facts read at 0x08008D14/0x08008D8A. Both pads are written before the engine's own 0x080098C6 OAM copy for that frame, which is the block after this slot."
sha256 = "176086ce69033bac39782318c0fdbb126422106c7731b3d61eff97bc2e9945fb"
transform = "identity"
alignment = 4

