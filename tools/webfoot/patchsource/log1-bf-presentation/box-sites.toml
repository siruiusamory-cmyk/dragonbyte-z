note = "the shared 156-byte donor bank (78 entries). Copied into OBJ entries 0..77 by THIS payload, after every guard, because lane B's copy of the same resource lives inside its MAPPED-SPEAKER path: an unmapped speaker falls back to the retail icon before that copy runs, so the box and the glyphs would otherwise carry no bank on screen. Native bank 7 and banks 8..15 are untouched, and B still works standalone when this word is zero. No new art and no new extent: the same resource bf-portrait declares."

[[fixup]]
payload = "bf-box-strips"
offset = 0x210
symbol = "lifecycle_table"
bytes = 112
note = "REQUIRED BINDING: D derives this bounded table from the built image's own record graph (the scene node plan this project emits). 112 B = u16 count 9, u16 reserved, nine 12-byte records. The strips payload reads bit 0 of a record's flags byte: the FIRST text stage of a conversation starts at 2048 (the donor's one-step-before-open), every later stage at the resting 1:1. While this word is zero the payload keeps diagnostic-03 behaviour (ramp on every stage); once bound, an unmatched or ambiguous text pointer means steady 1:1, never a guessed animation."

