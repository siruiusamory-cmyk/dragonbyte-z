[[payload]]
label = "bf-box-strips"
file = "bf-box-strips.bin"
source_class = "adapted"
origin_note = "the donor's own box mechanism: E measured BF drawing its dialogue box as three affine 8bpp OAM strips 64x64/64x64/32x64 at x 72/136/200, y 88, beside the 64x64 portrait at x 8 (run-bf-present-01, attr words re-read in run-bf-anim-01). The staging, cursor and packed shadow-OAM forms are LOG1 facts measured by E; the raster is the lane C conversion of donor file offset 0x71758 (160x64, 14 indices, shared low OBJ bank). The three entries carry attr0 bit 8 and matrix index 0 and the payload writes PA = PD = 2048 (the donor's own one-step-before-open value) into matrix 0's pad halfwords, so the shared uniform matrix scales the box to its donor opening size on the first dialogue frame. It scales whatever the fourth sprite is: the fallback 32x32 icon is never assumed to be 64x64, because this payload writes no size or attr word for it."
sha256 = "d5fe7c5bd27d7de2d9b48324a674e1daa02f73fff03180eba62679d11bc66a76"
transform = "identity"
alignment = 4
donor_sha256 = "940ad5f01db4465b8877dfe739510cbf34f4ea3d390f3df13519808bc36f059e"
donor_span = "0x071758-0x071A6C"

