    patch_sites:
      - kind: relative
        file_offset: 0x0000ef30
        base: 0x0800ef28
        evidence: >-
          Entry +0x08 of the NPC dialogue object method table. The dispatcher at
          0x08009828..0x08009830 reads the table word, adds the base and `bx`es
          the result, so the stored value is a signed self-relative offset with
          the Thumb bit in bit 0. The canonical word 0xFFFF6459 occurs exactly
          once in the image; E measured 3240 draw entries per 3600-frame run and
          the retained retail target 0x08005380 is called, never patched.
      - kind: relative
        file_offset: 0x0000ef44
        base: 0x0800ef28
        evidence: >-
          Entry +0x1C of the same NPC dialogue method table 0x0800EF28, the per-frame
          update method. Canonical word 0xFFFF646B resolves to 0x08005393 (update
          0x08005392), and it occurs exactly once in the image. E measured 1,319 entries
          in 1,500 frames (frames 181..1499), one per frame, with lr = 0x08005BA3,
          r1 = 0x08005393 and r2 = 0xFFFF646B (handoff-E-controller.md section 1); the
          only two writers of the page's +0x14/+0x18/+0x1C/+0x20 state are 0x0800930A
          and 0x08009328, and the OBJ flush precedes the update, so a payload placed here
          owns the reveal and its staged bytes are visible on the next frame
          (handoff-B-ownership.md). This is the one new retail seam the full update
          controller needs; the controller's own metadata arrives from lane A.
      - kind: absolute
        file_offset: 0x0011490
