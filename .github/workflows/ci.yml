name: PR gate

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh

jobs:
  gate:
    name: gate
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Make the checkout preserve the committed line endings
        run: |
          git config --global core.autocrlf false
          $autocrlf = git config --get core.autocrlf
          if ($autocrlf -ne "false") { throw "the checkout would convert line endings: core.autocrlf reads $autocrlf, not false" }

      - name: Check out the repository without keeping a credential (actions/checkout v4.4.0)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prove the checkout kept the committed bytes
        run: |
          $ledger = "docs/research/ROM_EDITOR_COVERAGE_LEDGER.md"
          $text = Get-Content -Raw -Path $ledger
          if ($text.Contains([char]13)) { throw "$ledger carries CR characters: the checkout converted line endings" }
          Write-Host "$ledger is CR-free at $($text.Length) characters"

      - name: Put the temporary root on the checkout's volume
        run: |
          $volume = Split-Path -Qualifier $env:GITHUB_WORKSPACE
          if (-not $volume) { throw "GITHUB_WORKSPACE names no volume, so the temporary root cannot share it" }
          $root = Join-Path $volume "tmp"
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          Add-Content -Path $env:GITHUB_ENV -Value "TMP=$root"
          Add-Content -Path $env:GITHUB_ENV -Value "TEMP=$root"
          Write-Host "temporary root $root, on the volume of $env:GITHUB_WORKSPACE"

      - name: Install Python 3.12 (actions/setup-python v5.6.0)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the shipping and research extras
        run: python -m pip install --quiet --disable-pip-version-check -e ".[dev,workbench,research]"

      - name: Classify the change and write the gate record
        run: |
          $base = "${{ github.event.pull_request.base.sha }}"
          if (-not $base) { $base = "${{ github.event.before }}" }
          if (-not $base -or $base -match '^0+$') { $base = "HEAD~1" }
          python -m tools.dev.ci_tier --base $base --head "$env:GITHUB_SHA"
          if ($LASTEXITCODE -ne 0) { throw "the change could not be classified against $base" }

      - name: Check the committed fixture and its decoded members by digest
        if: env.TIER != 'docs'
        run: |
          python -m pytest tests/integration/test_container_decode_synthetic.py -q
          if ($LASTEXITCODE -ne 0) {
            throw "hash identity failed: tests/integration/fixtures/synthetic_containers.json, its stored member or its packed member does not match the digest pinned in tests/integration/test_container_decode_synthetic.py"
          }

      - name: Run the tests the classifier selected
        if: env.TIER != 'docs'
        run: |
          $directory = Join-Path "build\ci-fast" $env:GITHUB_SHA
          New-Item -ItemType Directory -Force -Path $directory | Out-Null
          $selection = @(Get-Content -Path (Join-Path $directory 'selection.txt') | Where-Object { $_ })
          if ($selection.Count -eq 0) { throw "the classifier selected no test for tier $env:TIER" }
          & python -m pytest @selection -q -n 4 --dist loadfile --max-worker-restart=0 2>&1 | Tee-Object -FilePath (Join-Path $directory 'pytest.log')
          if ($LASTEXITCODE -ne 0) { throw "the selected tests failed with exit $LASTEXITCODE; the failing node ids are named above and in the job summary" }

      - name: Public surface
        run: python -m tools.quality.public_surface --all

      - name: Readability
        run: python -m tools.quality.readability --all

      - name: Architecture
        run: python -m tools.quality.architecture

      - name: Public release
        run: python -m tools.quality.public_release

      - name: Publish the record and name every failure in the summary
        if: always()
        run: |
          $directory = Join-Path "build\ci-fast" $env:GITHUB_SHA
          New-Item -ItemType Directory -Force -Path $directory | Out-Null
          $tier = if ($env:TIER) { $env:TIER } else { 'undetermined' }
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "commit: $env:GITHUB_SHA"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "tier: $tier"
          $log = Join-Path $directory 'pytest.log'
          if (Test-Path -LiteralPath $log) {
            $failed = @(Select-String -Path $log -Pattern '^(FAILED|ERROR) ' | ForEach-Object { $_.Line })
            if ($failed.Count -gt 0) {
              Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value 'failing tests:'
              foreach ($line in $failed) { Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $line }
            }
          }
          $record = Join-Path $directory 'record.txt'
          if (-not (Test-Path -LiteralPath $record)) {
            Add-Content -Path $record -Value 'fast gate record'
            Add-Content -Path $record -Value "sha            : $env:GITHUB_SHA"
            Add-Content -Path $record -Value "tier           : $tier"
          }
          Add-Content -Path $record -Value "verdict        : ${{ job.status }}"

      - name: Publish the gate record (actions/upload-artifact v4.6.2)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr-gate-record
          path: build/ci-fast/
