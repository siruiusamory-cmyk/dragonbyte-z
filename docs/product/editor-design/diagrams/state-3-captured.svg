    <rect x="168" y="76" width="144" height="131" fill="url(#p-dots)"/>
    <rect x="312" y="76" width="144" height="131" fill="#d5d5da"/>
    <rect x="456" y="76" width="144" height="131" fill="#cfcfd4"/>
    <rect x="24" y="207" width="144" height="131" fill="url(#p-cross)"/>
    <rect x="168" y="207" width="144" height="131" fill="url(#p-vert)"/>
    <rect x="312" y="207" width="144" height="131" fill="#d5d5da"/>
    <rect x="456" y="207" width="144" height="131" fill="#cfcfd4"/>
    <rect x="24" y="338" width="144" height="132" fill="#dcdce0"/>
    <rect x="168" y="338" width="144" height="132" fill="#cfcfd4"/>
    <rect x="312" y="338" width="144" height="132" fill="#d5d5da"/>
    <rect x="456" y="338" width="144" height="132" fill="#cfcfd4"/>
  </g>

  <rect x="22" y="74" width="292" height="267" fill="none" stroke="#9c2f6e" stroke-width="1.5" stroke-dasharray="7 4"/>
  <rect x="25" y="77" width="286" height="261" fill="none" stroke="#ffffff" stroke-width="1"/>
  <path d="M22 74 h16 M22 74 v16 M314 74 h-16 M314 74 v16 M22 341 h16 M22 341 v-16 M314 341 h-16 M314 341 v-16" stroke="#4a4a52" stroke-width="4" fill="none"/>

  <g font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#55555e">
    <text x="32" y="92">1</text>
    <text x="176" y="92">2</text>
    <text x="320" y="92">3</text>
    <text x="464" y="92">4</text>
    <text x="32" y="223">5</text>
    <text x="176" y="223">6</text>
    <text x="320" y="223">7</text>
    <text x="464" y="223">8</text>
    <text x="32" y="354">9</text>
    <text x="176" y="354">10</text>
    <text x="320" y="354">11</text>
    <text x="464" y="354">12</text>
  </g>

  <rect x="624" y="76" width="252" height="186" fill="#ffffff" stroke="#9a9aa1"/>
  <text x="636" y="98" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="600" fill="#1d1d21">Captured feature</text>
  <line x1="624" y1="108" x2="876" y2="108" stroke="#c4c4ca"/>
  <g stroke="#9a9aa1" stroke-width="1">
    <rect x="636" y="120" width="46" height="46" fill="url(#p-diag)"/>
    <rect x="682" y="120" width="46" height="46" fill="url(#p-dots)"/>
    <rect x="636" y="166" width="46" height="46" fill="url(#p-cross)"/>
    <rect x="682" y="166" width="46" height="46" fill="url(#p-vert)"/>
  </g>
  <text x="748" y="140" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#1d1d21">2 x 2 blocks</text>
  <text x="748" y="158" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#55555e">512 x 512 px</text>
  <text x="636" y="234" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#55555e">From Map 33, Background 0,</text>
  <text x="636" y="250" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#55555e">block 1.</text>

  <rect x="624" y="274" width="252" height="196" fill="#ffffff" stroke="#9a9aa1"/>
  <text x="636" y="296" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="600" fill="#1d1d21">Pictures this map uses</text>
  <line x1="624" y1="306" x2="876" y2="306" stroke="#c4c4ca"/>
  <rect x="636" y="318" width="44" height="44" fill="url(#p-diag)" stroke="#9a9aa1"/>
  <rect x="688" y="318" width="44" height="44" fill="url(#p-dots)" stroke="#9a9aa1"/>
  <rect x="740" y="318" width="44" height="44" fill="url(#p-cross)" stroke="#9a9aa1"/>
  <rect x="792" y="318" width="44" height="44" fill="url(#p-vert)" stroke="#9a9aa1"/>
  <text x="636" y="388" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#55555e">Drag on the map to capture</text>
  <text x="636" y="404" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#55555e">several blocks at once.</text>

  <rect x="0" y="480" width="900" height="36" fill="#e4e4e7"/>
  <line x1="0" y1="480" x2="900" y2="480" stroke="#9a9aa1"/>
  <text x="16" y="503" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" fill="#1d1d21">Stamp: feature captured. Move the pointer over the map and click to place it.</text>

  <g font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#1d1d21">
    <circle cx="150" cy="60" r="9" fill="#9c2f6e"/>
    <text x="146" y="64" fill="#ffffff">1</text>
    <circle cx="770" cy="131" r="9" fill="#9c2f6e"/>
    <text x="766" y="135" fill="#ffffff">2</text>
    <circle cx="304" cy="84" r="9" fill="#9c2f6e"/>
    <text x="300" y="88" fill="#ffffff">3</text>
    <circle cx="648" cy="396" r="9" fill="#9c2f6e"/>
    <text x="644" y="400" fill="#ffffff">4</text>
  </g>
  <g font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#55555e">
    <text x="16" y="536">1 Stamp becomes the active tool.</text>
    <text x="240" y="536">2 The well shows the captured blocks.</text>
    <text x="524" y="536">3 The source selection stays visible.</text>
    <text x="726" y="536">4 One hint, not a drag promise.</text>
  </g>
</svg>
