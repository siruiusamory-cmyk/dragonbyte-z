<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" role="img" aria-labelledby="t4 d4">
  <title id="t4">State S4: stamp preview, placement allowed</title>
  <desc id="d4">The captured feature follows the pointer as a translucent ghost with corner ticks, snapped to block 3, and the status line states what the click will do.</desc>
  <defs>
    <pattern id="p-diag" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#d3d3d8"/>
      <path d="M-2 2 L2 -2 M0 10 L10 0 M8 12 L12 8" stroke="#a8a8b1" stroke-width="2"/>
    </pattern>
    <pattern id="p-dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#c9c9cf"/>
      <circle cx="3" cy="3" r="1.6" fill="#90909a"/>
      <circle cx="8" cy="8" r="1.6" fill="#90909a"/>
    </pattern>
    <pattern id="p-cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#dcdce0"/>
      <path d="M0 5 L10 5 M5 0 L5 10" stroke="#b0b0b9" stroke-width="1.5"/>
    </pattern>
    <pattern id="p-vert" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#c4c4ca"/>
      <path d="M3 0 L3 10 M7 0 L7 10" stroke="#9b9ba4" stroke-width="2"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="900" height="560" fill="#f4f4f5"/>

  <rect x="0" y="0" width="900" height="40" fill="#ececee"/>
  <line x1="0" y1="40" x2="900" y2="40" stroke="#9a9aa1"/>
  <text x="18" y="26" font-family="Segoe UI, Tahoma, sans-serif" font-size="15" font-weight="700" fill="#1d1d21">Map 33</text>
  <text x="98" y="26" font-family="Segoe UI, Tahoma, sans-serif" font-size="14" fill="#55555e">Background 0 (BG0)</text>
  <rect x="268" y="11" width="72" height="20" rx="2" fill="#ffffff" stroke="#9a9aa1"/>
  <text x="278" y="25" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#1d1d21">Editable</text>
  <g>
    <rect x="548" y="10" width="62" height="22" rx="2" fill="#ffffff" stroke="#9a9aa1" opacity="0.45"/>
    <text x="560" y="25" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#74747c">Undo</text>
    <rect x="616" y="10" width="62" height="22" rx="2" fill="#ffffff" stroke="#9a9aa1" opacity="0.45"/>
    <text x="628" y="25" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#74747c">Redo</text>
    <rect x="684" y="10" width="62" height="22" rx="2" fill="#ffffff" stroke="#9a9aa1" opacity="0.45"/>
    <text x="696" y="25" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#74747c">Save</text>
  </g>
  <rect x="762" y="11" width="16" height="16" rx="1" fill="#2b2b31"/>
  <text x="786" y="26" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" fill="#1d1d21">Saved</text>

  <rect x="0" y="40" width="900" height="36" fill="#e4e4e7"/>
  <line x1="0" y1="76" x2="900" y2="76" stroke="#9a9aa1"/>
  <rect x="16" y="47" width="72" height="22" rx="2" fill="#ffffff" stroke="#9a9aa1"/>
  <text x="38" y="62" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" fill="#1d1d21">Select</text>
  <rect x="94" y="47" width="68" height="22" rx="2" fill="#d6d6db" stroke="#4a4a52"/>
  <circle cx="106" cy="58" r="3" fill="#2b2b31"/>
  <text x="116" y="62" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="600" fill="#1d1d21">Stamp</text>
  <rect x="168" y="47" width="60" height="22" rx="2" fill="#ffffff" stroke="#9a9aa1"/>
  <text x="180" y="62" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" fill="#1d1d21">Pan</text>
  <text x="700" y="62" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="600" fill="#1d1d21">2 x 2 blocks (512 x 512 px)</text>

  <rect x="24" y="76" width="576" height="394" fill="#e6e6e8" stroke="#9a9aa1"/>
  <g stroke="#a9a9b2" stroke-width="1">
    <rect x="24" y="76" width="144" height="131" fill="#dcdce0"/>
    <rect x="168" y="76" width="144" height="131" fill="#cfcfd4"/>
    <rect x="312" y="76" width="144" height="131" fill="#d5d5da"/>
    <rect x="456" y="76" width="144" height="131" fill="#dcdce0"/>
    <rect x="24" y="207" width="144" height="131" fill="url(#p-diag)"/>
    <rect x="168" y="207" width="144" height="131" fill="url(#p-dots)"/>
    <rect x="312" y="207" width="144" height="131" fill="#d5d5da"/>
    <rect x="456" y="207" width="144" height="131" fill="#cfcfd4"/>
    <rect x="24" y="338" width="144" height="132" fill="url(#p-cross)"/>
    <rect x="168" y="338" width="144" height="132" fill="url(#p-vert)"/>
    <rect x="312" y="338" width="144" height="132" fill="#d5d5da"/>
    <rect x="456" y="338" width="144" height="132" fill="#cfcfd4"/>
  </g>

  <rect x="22" y="205" width="292" height="267" fill="none" stroke="#9c2f6e" stroke-width="1.5" stroke-dasharray="7 4"/>
  <path d="M22 205 h14 M22 205 v14 M314 205 h-14 M314 205 v14 M22 472 h14 M22 472 v-14 M314 472 h-14 M314 472 v-14" stroke="#4a4a52" stroke-width="3" fill="none"/>

  <g opacity="0.6">
    <rect x="312" y="76" width="144" height="131" fill="url(#p-diag)"/>
    <rect x="456" y="76" width="144" height="131" fill="url(#p-dots)"/>
    <rect x="312" y="207" width="144" height="131" fill="url(#p-cross)"/>
    <rect x="456" y="207" width="144" height="131" fill="url(#p-vert)"/>
  </g>
  <rect x="310" y="74" width="292" height="267" fill="none" stroke="#9c2f6e" stroke-width="3"/>
  <rect x="313" y="77" width="286" height="261" fill="none" stroke="#ffffff" stroke-width="1"/>
  <path d="M310 74 h18 M310 74 v18 M602 74 h-18 M602 74 v18 M310 341 h18 M310 341 v-18 M602 341 h-18 M602 341 v-18" stroke="#2b2b31" stroke-width="4" fill="none"/>

  <path d="M356 132 l0 24 l7 -7 l6 11 l6 -3 l-6 -11 l9 -1 z" fill="#1d1d21" stroke="#ffffff" stroke-width="1"/>

  <g font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#55555e">
    <text x="32" y="92">1</text>
    <text x="176" y="92">2</text>
    <text x="464" y="92">4</text>
    <text x="32" y="223">5</text>
    <text x="176" y="223">6</text>
    <text x="32" y="354">9</text>
    <text x="176" y="354">10</text>
    <text x="320" y="354">11</text>
    <text x="464" y="354">12</text>
  </g>

  <rect x="624" y="76" width="252" height="186" fill="#ffffff" stroke="#9a9aa1"/>
  <text x="636" y="98" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="600" fill="#1d1d21">Captured feature</text>
  <line x1="624" y1="108" x2="876" y2="108" stroke="#c4c4ca"/>
  <g stroke="#9a9aa1" stroke-width="1">
    <rect x="636" y="120" width="46" height="46" fill="url(#p-diag)"/>
    <rect x="682" y="120" width="46" height="46" fill="url(#p-dots)"/>
    <rect x="636" y="166" width="46" height="46" fill="url(#p-cross)"/>
    <rect x="682" y="166" width="46" height="46" fill="url(#p-vert)"/>
  </g>
  <text x="748" y="140" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#1d1d21">2 x 2 blocks</text>
  <text x="748" y="158" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#55555e">512 x 512 px</text>
  <text x="636" y="234" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#55555e">Placement: allowed here.</text>
  <text x="636" y="250" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#55555e">All 4 blocks fit.</text>

  <rect x="624" y="274" width="252" height="196" fill="#ffffff" stroke="#9a9aa1"/>
  <text x="636" y="296" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="600" fill="#1d1d21">One undo step</text>
  <line x1="624" y1="306" x2="876" y2="306" stroke="#c4c4ca"/>
  <text x="636" y="328" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#55555e">This placement is one undo step.</text>
  <text x="636" y="346" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#55555e">A drag merges into one step.</text>
  <text x="636" y="386" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#55555e">Technical details</text>
  <text x="636" y="404" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#74747c">collapsed; holds block coords</text>

  <rect x="0" y="480" width="900" height="36" fill="#e4e4e7"/>
  <line x1="0" y1="480" x2="900" y2="480" stroke="#9a9aa1"/>
  <text x="16" y="503" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" fill="#1d1d21">Stamp: click to place 4 blocks. Enter places at the same position from the keyboard.</text>

  <g font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#1d1d21">
    <circle cx="360" cy="100" r="9" fill="#9c2f6e"/>
    <text x="356" y="104" fill="#ffffff">1</text>
    <circle cx="594" cy="66" r="9" fill="#9c2f6e"/>
    <text x="590" y="70" fill="#ffffff">2</text>
    <circle cx="306" cy="122" r="9" fill="#9c2f6e"/>
    <text x="302" y="126" fill="#ffffff">3</text>
    <circle cx="760" cy="494" r="9" fill="#9c2f6e"/>
    <text x="756" y="498" fill="#ffffff">4</text>
  </g>
  <g font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#55555e">
    <text x="16" y="536">1 Ghost art at 60 per cent opacity.</text>
    <text x="240" y="536">2 Heavier outline plus ticks.</text>
    <text x="470" y="536">3 Snapped to block 3's corner.</text>
    <text x="700" y="536">4 The status names the result.</text>
  </g>
</svg>
