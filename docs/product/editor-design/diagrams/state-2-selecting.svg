    <rect x="312" y="76" width="144" height="131" fill="#d5d5da"/>
    <rect x="456" y="76" width="144" height="131" fill="#cfcfd4"/>
    <rect x="24" y="207" width="144" height="131" fill="#cfcfd4"/>
    <rect x="168" y="207" width="144" height="131" fill="#cfcfd4"/>
    <rect x="312" y="207" width="144" height="131" fill="#d5d5da"/>
    <rect x="456" y="207" width="144" height="131" fill="#cfcfd4"/>
    <rect x="24" y="338" width="144" height="132" fill="#d5d5da"/>
    <rect x="168" y="338" width="144" height="132" fill="#cfcfd4"/>
    <rect x="312" y="338" width="144" height="132" fill="#d5d5da"/>
    <rect x="456" y="338" width="144" height="132" fill="#cfcfd4"/>
  </g>

  <rect x="24" y="76" width="144" height="131" fill="#54545c" opacity="0.14"/>
  <rect x="168" y="76" width="144" height="131" fill="#54545c" opacity="0.14"/>
  <rect x="312" y="76" width="144" height="131" fill="#54545c" opacity="0.14"/>
  <rect x="456" y="76" width="144" height="131" fill="#54545c" opacity="0.14"/>
  <rect x="24" y="207" width="144" height="131" fill="#54545c" opacity="0.14"/>
  <rect x="312" y="207" width="144" height="131" fill="#54545c" opacity="0.14"/>
  <rect x="456" y="207" width="144" height="131" fill="#54545c" opacity="0.14"/>
  <rect x="312" y="338" width="144" height="132" fill="#54545c" opacity="0.14"/>
  <rect x="456" y="338" width="144" height="132" fill="#54545c" opacity="0.14"/>

  <g stroke="#a9a9b2" stroke-width="1">
    <rect x="24" y="207" width="144" height="131" fill="url(#p-diag)"/>
    <rect x="168" y="207" width="144" height="131" fill="url(#p-dots)"/>
    <rect x="24" y="338" width="144" height="132" fill="url(#p-cross)"/>
    <rect x="168" y="338" width="144" height="132" fill="url(#p-vert)"/>
  </g>
  <rect x="24" y="207" width="288" height="263" fill="#ffffff" opacity="0.42"/>

  <rect x="22" y="205" width="292" height="267" fill="none" stroke="#9c2f6e" stroke-width="3"/>
  <rect x="25" y="208" width="286" height="261" fill="none" stroke="#ffffff" stroke-width="1"/>
  <path d="M22 205 h16 M22 205 v16 M314 205 h-16 M314 205 v16 M22 472 h16 M22 472 v-16 M314 472 h-16 M314 472 v-16" stroke="#4a4a52" stroke-width="4" fill="none"/>

  <path d="M236 404 l0 22 l6 -6 l5 10 l6 -3 l-5 -10 l8 -1 z" fill="#1d1d21" stroke="#ffffff" stroke-width="1"/>

  <g font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#55555e">
    <text x="32" y="92">1</text>
    <text x="176" y="92">2</text>
    <text x="320" y="92">3</text>
    <text x="464" y="92">4</text>
    <text x="32" y="223">5</text>
    <text x="176" y="223">6</text>
    <text x="320" y="223">7</text>
    <text x="464" y="223">8</text>
    <text x="32" y="354">9</text>
    <text x="176" y="354">10</text>
    <text x="320" y="354">11</text>
    <text x="464" y="354">12</text>
  </g>

  <rect x="624" y="76" width="252" height="150" fill="#ffffff" stroke="#9a9aa1"/>
  <text x="636" y="98" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="600" fill="#1d1d21">Captured feature</text>
  <line x1="624" y1="108" x2="876" y2="108" stroke="#c4c4ca"/>
  <rect x="636" y="120" width="228" height="62" fill="#f0f0f2" stroke="#c4c4ca" stroke-dasharray="4 3"/>
  <text x="654" y="156" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" fill="#74747c">Release to capture</text>
  <text x="636" y="204" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#55555e">Nothing is captured until the drag</text>
  <text x="636" y="220" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#55555e">ends. Escape cancels it.</text>

  <rect x="624" y="238" width="252" height="232" fill="#ffffff" stroke="#9a9aa1"/>
  <text x="636" y="260" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="600" fill="#1d1d21">Selection</text>
  <line x1="624" y1="270" x2="876" y2="270" stroke="#c4c4ca"/>
  <text x="636" y="292" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#55555e">Source: Map 33, Background 0</text>
  <text x="636" y="310" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#55555e">From block 5, 2 x 2 blocks</text>

  <rect x="0" y="480" width="900" height="36" fill="#e4e4e7"/>
  <line x1="0" y1="480" x2="900" y2="480" stroke="#9a9aa1"/>
  <text x="16" y="503" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" fill="#1d1d21">Select: dragging 2 x 2 blocks. Shift+arrows does the same from the keyboard.</text>

  <g font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#1d1d21">
    <circle cx="712" cy="52" r="9" fill="#9c2f6e"/>
    <text x="708" y="56" fill="#ffffff">1</text>
    <circle cx="300" cy="240" r="9" fill="#9c2f6e"/>
    <text x="296" y="244" fill="#ffffff">2</text>
    <circle cx="520" cy="120" r="9" fill="#9c2f6e"/>
    <text x="516" y="124" fill="#ffffff">3</text>
    <circle cx="306" cy="212" r="9" fill="#9c2f6e"/>
    <text x="302" y="216" fill="#ffffff">4</text>
  </g>
  <g font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#55555e">
    <text x="16" y="536">1 Live size, in blocks and pixels.</text>
    <text x="240" y="536">2 Blocks inside step one level up.</text>
    <text x="486" y="536">3 The rest of the layer steps down.</text>
    <text x="700" y="536">4 Corner ticks and weight, not colour.</text>
  </g>
